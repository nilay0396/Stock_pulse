[build]
  base = "frontend"
  # Build the frontend, then install + bundle the Netlify Function ourselves
  # (esbuild --bundle inlines every npm dependency into a single self-contained
  # file) rather than relying on Netlify's own per-function dependency install,
  # which was not picking up netlify/functions/package.json and left `hono`
  # etc. as unresolved imports at runtime (ERR_MODULE_NOT_FOUND).
  command = "yarn build && cd ../netlify/functions && npm install && npm run bundle"
  publish = "build"
  functions = "../netlify/functions-dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://*.supabase.co https://query1.finance.yahoo.com https://query2.finance.yahoo.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
